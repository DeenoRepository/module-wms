name: Module CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@deenorepository'
      - name: Verify Absence of AI Artifacts
        run: |
          if find . -type d -name ".agents" -o -name "AGENTS.md" -o -name "CLAUDE.md" | grep -q .; then
            echo "Error: AI artifacts are strictly prohibited in product repositories."
            exit 1
          fi
          echo "Cleanliness check passed."
      - name: Run TDD unit tests
        run: npx vitest run
